plugins {
	id 'fabric-loom' version '1.15-SNAPSHOT'
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name  // Changed from archivesBaseName
}

version = project.mod_version
group = 'com.github.Soulpuhr0'

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/"}
	maven { url 'https://jitpack.io' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.4.1")))
	include(implementation ('com.google.code.gson:gson:2.10.1'))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}  // Updated reference
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}

		maven(MavenPublication) {
			groupId = 'com.Github'
			artifactId = 'Soulphur0'
			version = "1.1.0"
			from components.java

			pom {
				description = 'Elytra Aeronautics Jar Library'
			}
		}
	}

	repositories {
	}
}